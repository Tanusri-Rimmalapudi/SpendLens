<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendLens - Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="dashboard">

  <header>
    <h1>SpendLens</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="expenses.html">Expenses</a>
      <a href="add-expense.html">Add Expense</a>
    </nav>
  </header>

  <main>
    <h2>Dashboard</h2>

    <!-- Summary (filled in by app.js) -->
    <div class="summary">
      <div class="box">
        <div class="number" id="total-spent">$0.00</div>
        <div>Total spent</div>
      </div>
      <div class="box">
        <div class="number" id="expense-count">0</div>
        <div>Expenses</div>
      </div>
      <div class="box">
        <div class="number" id="top-category">-</div>
        <div>Biggest category</div>
      </div>
    </div>

    <!-- Spending by category (bars built by app.js) -->
    <div class="box">
      <h2>Spending by Category</h2>
      <div id="category-bars"></div>
    </div>

    <!-- Recent expenses -->
    <div class="box">
      <h2>Recent Expenses</h2>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Category</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="recent-body"></tbody>
      </table>
      <p><a href="expenses.html">See all expenses</a></p>
    </div>
  </main>

  <footer>
    SpendLens - CPSC 349 Milestone 2
  </footer>

  <script src="app.js"></script>
</body>
</html>
